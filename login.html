<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>登录 · 听写本</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f6f3ee; color: #29323b; font: 16px/1.5 system-ui, sans-serif; }
    main { width: min(100%, 420px); padding: 32px; border: 1px solid #e2ddd5; border-radius: 18px; background: white; box-shadow: 0 12px 38px #283c5012; }
    a { color: #425e76; } h1 { margin: 26px 0 8px; font-size: 28px; } p { color: #596675; }
    label { display: block; margin: 20px 0 6px; font-weight: 600; }
    input { width: 100%; padding: 12px; border: 1px solid #bbc5cf; border-radius: 8px; font: inherit; }
    button { width: 100%; margin-top: 24px; padding: 12px; border: 0; border-radius: 8px; background: #dce1e5; color: #53606b; font: 600 16px system-ui, sans-serif; }
    .notice { padding: 12px; border-radius: 8px; background: #fff5df; color: #60481e; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <a href="./">← 返回听写本</a>
    <h1>登录听写本</h1>
    <p>使用用户名和密码登录。</p>
    <p class="notice" role="status">账号登录和云端同步尚未启用，暂时无法提交或验证账号。现有数据仍保存在本机浏览器。</p>
    <form onsubmit="return false">
      <label for="username">用户名</label>
      <input id="username" name="username" autocomplete="username">
      <label for="password">密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password">
      <button type="submit" disabled>登录暂未启用</button>
    </form>
  </main>
</body>
</html>
